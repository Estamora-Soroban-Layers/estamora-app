name: Feature Request
description: Propose a new feature for the Estamora Web Console
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement or new capability for the Estamora DApp console.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What challenge or user workflow does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed feature or UI flow.
    validations:
      required: true
