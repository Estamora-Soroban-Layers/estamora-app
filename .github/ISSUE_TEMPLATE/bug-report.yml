name: Bug Report
description: Report an issue in the Estamora Web Console
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with `estamora-app`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue in the DApp.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & Wallet
      description: Browser version and Freighter wallet version.
    validations:
      required: true
