name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify DApp
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Bundle
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || (echo "Missing dist/index.html" && exit 1)
          echo "Production build verified."

      - name: Verify Open Source Governance
        run: |
          test -f LICENSE || (echo "Missing LICENSE" && exit 1)
          test -f README.md || (echo "Missing README.md" && exit 1)
          echo "Governance documentation verified."
