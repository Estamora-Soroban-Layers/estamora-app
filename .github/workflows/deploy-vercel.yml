name: Deploy to Vercel

# What is deployed is what CI built.
#
# Letting Vercel build this application would mean the published bundle comes from a second
# build, with a Node version Vercel chose rather than the one `engines` and this workflow
# pin. The bundle is the whole artefact here -- there is no server -- so a build nobody
# validated is a build nobody checked.
#
# Vercel's own build step (`scripts/assert-built.sh`) therefore asserts the artefact exists
# instead of producing it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  # The project is identified from repository secrets rather than from a committed
  # `.vercel/` directory, so nothing about the deployment lives in the repository.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://estamora-app.vercel.app
    steps:
      - name: Fail early when the deployment credentials are absent
        # Otherwise the failure surfaces inside the Vercel CLI as an authentication error,
        # which reads like a permissions problem rather than a missing setting.
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set for this repository"
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify, then build
        # The gate runs again here rather than trusting the CI run on the same commit. A
        # deployment that can happen while a check is red is not a gate.
        run: |
          npm run format:check
          npm run typecheck
          npm run test
          npm run build

      - name: Retrieve the project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Package the artefact CI built
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publish it
        id: deploy
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: The deployed application serves its routes
        # Deployed is not the same as serving, and *published* is not the same as *switched*.
        # The hash routes are client-side, so what is checked is that the shell is served and
        # that the assets it references exist.
        #
        # This is also the step that waits for the alias, so that the checks below can rely on it
        # having moved. `vercel deploy --prod` returning is not the edge having switched: for a
        # few seconds the alias can answer with the new shell while the asset that shell names
        # is not reachable yet. That is a published deployment mid-switch, not a broken one --
        # a run of this job failed on `assets/index-<hash>.js -> 404` for a deployment that was
        # serving correctly seconds later, which is how the wait below came to exist. The
        # assertions are unchanged; what they gained is a bounded retry, so that a slow edge is
        # not reported as a defect. `estamora-docs` waits the same way, for the same reason.
        run: |
          set -euo pipefail
          base="https://estamora-app.vercel.app"

          # Both halves of the pair are read from one response on purpose: the shell names the
          # entry chunk, and the chunk is then requested by that name. Asserting them in separate
          # steps would let them describe two different deployments and still pass.
          serves_consistently() {
            local shell entry code
            shell="$(curl -s -m 30 "$base/")" || return 1
            entry="$(printf '%s\n' "$shell" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
            # A shell with no entry chunk is not a switch in progress, it is a response that is
            # not the application; retrying would only delay the report, so it fails immediately.
            [ -n "$entry" ] || return 2
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$base/$entry")"
            printf '  %s -> %s\n' "$entry" "$code"
            [ "$code" = "200" ] || return 1
          }

          echo "the production alias, once the edge has switched to it:"
          deadline=12
          for attempt in $(seq 1 "$deadline"); do
            status=0
            serves_consistently || status=$?
            if [ "$status" = "0" ]; then
              echo "::notice::the production alias serves its shell and its entry chunk (attempt $attempt)"
              break
            fi
            if [ "$status" = "2" ]; then
              echo "::error::the served page references no entry chunk, which is not a switch in progress but a response that is not this application"
              exit 1
            fi
            if [ "$attempt" = "$deadline" ]; then
              echo "::error::the production alias did not serve its entry chunk within $deadline attempts; the deployment is published but the edge has not switched, or the artefact is incomplete"
              exit 1
            fi
            echo "  not yet; waiting 15s"
            sleep 15
          done

          for path in "/" "/favicon.svg"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$base$path")"
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      - name: Every cross-origin URL is readable from the deployed origin
        # This runs the check against the URLs in `src/constants.ts` rather than against a list
        # written here, and that difference is the whole lesson of the bug it replaced:
        #
        # This step used to assert three hard-coded URLs, one of which was
        # `raw.githubusercontent.com/...` — correct, and *not what the application used*. The
        # application used `github.com/.../raw/...`, which answers 302 with an empty
        # `access-control-allow-origin`; every browser blocked it, so the deployed application
        # could not read its own default report while this step reported success. A check that
        # names its own URLs cannot guard the constants the application fetches.
        #
        # `scripts/check-browser-fetchable.ts` reads the constants, follows the redirect chain
        # by hand, and fails on the first hop a browser would reject.
        run: npm run check:browser-fetchable
